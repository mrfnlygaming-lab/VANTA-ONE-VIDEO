name: Build VANTA ONE with real on-device AI video

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-video:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Check out VANTA source
        uses: actions/checkout@v5
      - name: Check out MOVD (MIT-licensed diffusion engine)
        uses: actions/checkout@v5
        with:
          repository: eai-lab/MOVD
          ref: main
          path: vendor/MOVD
      - name: Check Swift integration before model download
        run: |
          python3 -m py_compile scripts/assemble_video_app.py
          python3 scripts/assemble_video_app.py --movd vendor/MOVD --models /tmp/empty-models --output "$RUNNER_TEMP/VantaSourceCheck" --source-only-check
      - name: Restore cache of official MOVD STDiT model archive
        id: stdit-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/movd-weights/STDiT&TDTM.zip
          key: movd-official-stdit-2026-v1
      - name: Prepare isolated download tool
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/vanta-py"
          "$RUNNER_TEMP/vanta-py/bin/python" -m pip install 'gdown>=5,<6'
          mkdir -p "$RUNNER_TEMP/movd-weights"
      - name: Download official STDiT video diffusion models
        if: steps.stdit-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/vanta-py/bin/python" -m gdown 'https://drive.google.com/uc?id=1J-w_iheElc90Ht7U8d3u55coa5elT52b' -O "$RUNNER_TEMP/movd-weights/STDiT&TDTM.zip"
          test -s "$RUNNER_TEMP/movd-weights/STDiT&TDTM.zip"
      - name: Save STDiT model cache immediately
        if: steps.stdit-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/movd-weights/STDiT&TDTM.zip
          key: movd-official-stdit-2026-v1
      - name: Download official T5 and VAE models
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/vanta-py/bin/python" -m gdown 'https://drive.google.com/uc?id=1aSQ_XBWR6n4YUS4fC51RFLoFppar0IQ1' -O "$RUNNER_TEMP/movd-weights/T5.zip"
          "$RUNNER_TEMP/vanta-py/bin/python" -m gdown 'https://drive.google.com/uc?id=1zSnkLJQ1oaqCAup_5cs-AUWLBLJWr48s' -O "$RUNNER_TEMP/movd-weights/VAE.zip"
          test -s "$RUNNER_TEMP/movd-weights/T5.zip"
          test -s "$RUNNER_TEMP/movd-weights/VAE.zip"
      - name: Unpack official MOVD Core ML model archives
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=("$RUNNER_TEMP"/movd-weights/*.zip)
          if (( ${#archives[@]} == 0 )); then echo 'No MOVD model archives found'; exit 1; fi
          for archive in "${archives[@]}"; do
            dest="${archive%.zip}"
            mkdir -p "$dest"
            echo "Unpacking $(basename "$archive")"
            unzip -q "$archive" -d "$dest"
          done
          count=$(find "$RUNNER_TEMP/movd-weights" -type d -name '*.mlpackage' | wc -l | tr -d ' ')
          echo "Core ML source packages: $count"
          if [ "$count" -eq 0 ]; then echo 'No Core ML models in archives'; exit 1; fi
      - name: Show available disk and downloaded models
        run: |
          df -h .
          find "$RUNNER_TEMP/movd-weights" \( -name '*.mlpackage' -o -name '*.mlmodelc' \) | head -50
      - name: Assemble the VANTA ONE video app and require all model files
        run: |
          python3 scripts/assemble_video_app.py \
            --movd vendor/MOVD \
            --models "$RUNNER_TEMP/movd-weights" \
            --output "$RUNNER_TEMP/VantaVideoBuiltSource"
      - name: Build native iPhone arm64 app with Core ML video weights
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/VantaVideoBuiltSource"
          xcodebuild -list -project On-Device-MOVD-Sora.xcodeproj
          xcodebuild \
            -project On-Device-MOVD-Sora.xcodeproj \
            -scheme On-Device-MOVD-Sora \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/VantaVideoDerived" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned iPhone IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/VantaPackage/Payload"
          cp -R "$RUNNER_TEMP/VantaVideoDerived/Build/Products/Release-iphoneos/On-Device-MOVD-Sora.app" \
            "$RUNNER_TEMP/VantaPackage/Payload/"
          cd "$RUNNER_TEMP/VantaPackage"
          zip -qr "$GITHUB_WORKSPACE/VANTA_ONE_VIDEO_unsigned.ipa" Payload
      - name: Upload video-capable iPhone build
        uses: actions/upload-artifact@v4
        with:
          name: VANTA_ONE_VIDEO_unsigned_IPA
          path: VANTA_ONE_VIDEO_unsigned.ipa
          retention-days: 7
