name: Build VANTA ONE with real on-device AI video

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-video:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Check out VANTA source
        uses: actions/checkout@v4
      - name: Check out MOVD (MIT-licensed diffusion engine)
        uses: actions/checkout@v4
        with:
          repository: eai-lab/MOVD
          ref: main
          path: vendor/MOVD
      - name: Download public MOVD Core ML model files
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/vanta-py"
          "$RUNNER_TEMP/vanta-py/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/vanta-py/bin/python" -m pip install 'gdown>=5,<6'
          mkdir -p "$RUNNER_TEMP/movd-weights"
          # The weights are maintained by the MOVD researchers; they are NOT
          # included in this source archive. A large Google Drive folder may
          # hit download limits, in which case the job must fail transparently.
          "$RUNNER_TEMP/vanta-py/bin/python" -m gdown --folder --remaining-ok \
            'https://drive.google.com/drive/folders/1L6pVi3KmyLygR_pvKofRL-21adKsEb4p' \
            -O "$RUNNER_TEMP/movd-weights"
      - name: Show available disk and downloaded models
        run: |
          df -h .
          find "$RUNNER_TEMP/movd-weights" \( -name '*.mlpackage' -o -name '*.mlmodelc' \) | head -50
      - name: Assemble the VANTA ONE video app and require all model files
        run: |
          python3 scripts/assemble_video_app.py \
            --movd vendor/MOVD \
            --models "$RUNNER_TEMP/movd-weights" \
            --output "$RUNNER_TEMP/VantaVideoBuiltSource"
      - name: Build native iPhone arm64 app with Core ML video weights
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/VantaVideoBuiltSource"
          xcodebuild -list -project On-Device-MOVD-Sora.xcodeproj
          xcodebuild \
            -project On-Device-MOVD-Sora.xcodeproj \
            -scheme On-Device-MOVD-Sora \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/VantaVideoDerived" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned iPhone IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/VantaPackage/Payload"
          cp -R "$RUNNER_TEMP/VantaVideoDerived/Build/Products/Release-iphoneos/On-Device-MOVD-Sora.app" \
            "$RUNNER_TEMP/VantaPackage/Payload/"
          cd "$RUNNER_TEMP/VantaPackage"
          zip -qr "$GITHUB_WORKSPACE/VANTA_ONE_VIDEO_unsigned.ipa" Payload
      - name: Upload video-capable iPhone build
        uses: actions/upload-artifact@v4
        with:
          name: VANTA_ONE_VIDEO_unsigned_IPA
          path: VANTA_ONE_VIDEO_unsigned.ipa
          retention-days: 7
