name: VANTA web check

on:
  push:
    branches:
      - codex/vanta-browser-studio

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: node --check server/index.js
      - run: node --check server/vanta-motion-service.js
      - run: node --check server/local-audio-service.js
      - run: npm run build
